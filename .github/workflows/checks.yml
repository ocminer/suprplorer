name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet blake3
      - name: Validate labels files
        run: |
          cd indexer
          for f in ../labels/*.json; do python label.py "$(basename "$f" .json)" check "$f"; done
      - name: Validate benchmarks files
        run: for f in benchmarks/*.json; do python tools/benchmarks.py check "$f"; done
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 detect --source /repo --config /repo/.gitleaks.toml --redact -v
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd web && npm ci --ignore-scripts --no-audit --no-fund && node --check server.js && npm audit --omit=dev --audit-level=high
